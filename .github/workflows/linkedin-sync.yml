name: Sync LinkedIn posts

# Nightly: scrape the owner's own public LinkedIn posts via a third-party API
# (Apify) and write assets/posts.json. If it changed, commit + push — which
# triggers the deploy workflow and refreshes the site's Writing section.
#
# Setup (one-time): add repo secrets APIFY_TOKEN and LINKEDIN_PROFILE_URL
# (optionally APIFY_ACTOR and NTFY_TOPIC). Without them, the job no-ops safely.
on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily (before the 07:00 repo scan)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch LinkedIn posts → assets/posts.json
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR: ${{ secrets.APIFY_ACTOR }}
          LINKEDIN_PROFILE_URL: ${{ secrets.LINKEDIN_PROFILE_URL }}
          MAX_POSTS: '8'
        run: node scripts/fetch-linkedin.mjs

      - name: Commit & push if changed
        env:
          OPTIONAL_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/posts.json; then
            echo "No post changes."
            exit 0
          fi
          n=$(node -e "console.log(JSON.parse(require('fs').readFileSync('assets/posts.json','utf8')).length)")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/posts.json
          git commit -m "chore: sync LinkedIn posts (${n})"
          git push
          if [ -n "${OPTIONAL_NTFY_TOPIC:-}" ]; then
            curl -s -H "Title: danaital — LinkedIn sync" -H "Tags: memo" \
                 -d "Writing section updated: ${n} posts" \
                 "https://ntfy.sh/${OPTIONAL_NTFY_TOPIC}" >/dev/null || true
          fi
