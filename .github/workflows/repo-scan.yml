name: Daily GitHub project scan

# Once a day this:
#   1. finds public repos you've created that aren't featured on the site yet, and
#   2. audits repository privacy — flags any PUBLIC repo not on the allowlist
#      (so a repo that should be private, or one whose visibility changed, gets caught).
# Both are collected into a single tracking issue (+ optional ntfy phone push).
on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan repos + audit privacy
        env:
          # GITHUB_TOKEN sees public repos only. To audit PRIVATE repos too (confirm
          # they're still private), create a PAT with `repo` scope and save it as the
          # secret GH_SCAN_TOKEN — it's used automatically when present.
          GH_TOKEN: ${{ secrets.GH_SCAN_TOKEN || secrets.GITHUB_TOKEN }}
          OPTIONAL_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail

          # Repos that are INTENTIONALLY public — add names here to silence them.
          ALLOWLIST="danaital.com"

          # All own (non-fork) repos with visibility: "<isPrivate>\t<name>".
          gh repo list danaital --limit 200 --source \
            --json name,isPrivate,isFork \
            --jq '.[] | select(.isFork==false) | "\(.isPrivate)\t\(.name)"' \
            | sort -k2 > repos_vis.tsv

          # Names only (for the "not yet featured" diff).
          cut -f2 repos_vis.tsv | sort -u > all_repos.txt

          # Repos already linked from the site.
          grep -oE 'github\.com/danaital/[A-Za-z0-9._-]+' assets/data.js \
            | sed 's#.*/##' | sort -u > featured.txt

          # New = own repos not yet featured.
          comm -23 all_repos.txt featured.txt > new.txt || true

          # Privacy audit = public repos not on the allowlist.
          : > public_flagged.txt
          while IFS=$'\t' read -r priv name; do
            if [ "$priv" = "false" ]; then
              case " $ALLOWLIST " in
                *" $name "*) : ;;                      # intentionally public — skip
                *) echo "$name" >> public_flagged.txt ;;
              esac
            fi
          done < repos_vis.tsv

          echo "== new repos ==";    cat new.txt || true
          echo "== public (flagged) =="; cat public_flagged.txt || true

          have_new=$([ -s new.txt ] && echo 1 || echo 0)
          have_pub=$([ -s public_flagged.txt ] && echo 1 || echo 0)

          if [ "$have_new" = 0 ] && [ "$have_pub" = 0 ]; then
            echo "All clear — nothing to feature, no unexpected public repos."
            exit 0
          fi

          # Build a single combined issue body.
          {
            echo "_Daily automated scan of \`danaital\` repositories._"
            echo

            if [ "$have_new" = 1 ]; then
              echo "## 🆕 Repos not yet featured on danaital.com"
              echo
              while read -r r; do
                [ -n "$r" ] && echo "- [\`$r\`](https://github.com/danaital/$r)"
              done < new.txt
              echo
            fi

            if [ "$have_pub" = 1 ]; then
              echo "## 🔓 Public repositories — confirm these should be public"
              echo
              echo "If any of these should be **private**, change it in the repo's Settings → General → Danger Zone, then add intentional ones to the workflow allowlist to silence them."
              echo
              while read -r r; do
                [ -n "$r" ] && echo "- [\`$r\`](https://github.com/danaital/$r) — \`Settings/General\`"
              done < public_flagged.txt
              echo
            fi

            echo "---"
            echo "_Close this issue once reviewed; it's recreated/updated on the next scan if anything still needs attention._"
          } > body.md

          # Update existing tracking issue or open a new one.
          num=$(gh issue list --state open --search 'in:title danaital daily scan' \
                  --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file body.md
            echo "Updated issue #$num"
          else
            gh issue create --title "🔭 danaital daily scan — repos & privacy" --body-file body.md
          fi

          # Optional phone push via ntfy.sh (set the NTFY_TOPIC secret to enable).
          if [ -n "${OPTIONAL_NTFY_TOPIC:-}" ]; then
            n_new=$(grep -c . new.txt 2>/dev/null || echo 0)
            n_pub=$(grep -c . public_flagged.txt 2>/dev/null || echo 0)
            prio="default"; [ "$n_pub" -gt 0 ] && prio="high"
            curl -s -H "Title: danaital repo scan" -H "Priority: ${prio}" -H "Tags: mag,lock" \
                 -d "${n_new} new repo(s) to feature · ${n_pub} public repo(s) to review" \
                 "https://ntfy.sh/${OPTIONAL_NTFY_TOPIC}" >/dev/null || true
          fi
