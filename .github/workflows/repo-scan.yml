name: Daily GitHub project scan

# Once a day, look for public repos you've created that aren't featured on the
# site yet, and collect them into a single tracking issue so they can be
# curated in. (Private repos need a PAT — see notes at the bottom.)
on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find repos not yet featured
        env:
          # GITHUB_TOKEN sees public repos. To include PRIVATE repos, create a
          # PAT with `repo` scope, save it as the secret GH_SCAN_TOKEN, and it
          # will be used automatically.
          GH_TOKEN: ${{ secrets.GH_SCAN_TOKEN || secrets.GITHUB_TOKEN }}
          OPTIONAL_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail

          # All of danaital's own (non-fork) repos the token can see.
          gh repo list danaital --limit 200 --source \
            --json name,isFork,description,url \
            --jq '.[] | select(.isFork==false) | .name' | sort -u > all_repos.txt

          # Repos already linked from the site.
          grep -oE 'github\.com/danaital/[A-Za-z0-9._-]+' assets/data.js \
            | sed 's#.*/##' | sort -u > featured.txt

          # New = own repos not yet featured.
          comm -23 all_repos.txt featured.txt > new.txt || true

          echo "New repos found:"; cat new.txt || true
          if [ ! -s new.txt ]; then
            echo "Nothing new. Exiting."
            exit 0
          fi

          # Build issue body.
          {
            echo "These repos aren't featured on **danaital.com** yet:"
            echo
            while read -r r; do
              [ -n "$r" ] && echo "- [\`$r\`](https://github.com/danaital/$r)"
            done < new.txt
            echo
            echo "_Auto-generated by the daily scan. Close this issue once they're added (or intentionally skipped) in \`assets/data.js\`._"
          } > body.md

          # Update the existing tracking issue, or open a new one.
          num=$(gh issue list --state open --search 'in:title New repos to feature' \
                  --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file body.md
            echo "Updated issue #$num"
          else
            gh issue create --title "🆕 New repos to feature on danaital.com" --body-file body.md
          fi

          # Optional phone push via ntfy.sh (set the NTFY_TOPIC secret to enable).
          if [ -n "${OPTIONAL_NTFY_TOPIC:-}" ]; then
            count=$(grep -c . new.txt || echo 0)
            curl -s -H "Title: New GitHub projects" \
                 -d "$count new repo(s) ready to feature on danaital.com" \
                 "https://ntfy.sh/${OPTIONAL_NTFY_TOPIC}" >/dev/null || true
          fi
