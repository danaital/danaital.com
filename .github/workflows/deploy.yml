name: Deploy to GitHub Pages

# CI/CD pipeline: every push to master builds and deploys the static site.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (TypeScript → assets/*.js)
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # This is a no-build static site (HTML/CSS/JS). Upload the repo root,
      # excluding repo-meta files that don't belong on the live site.
      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' \
                --exclude='node_modules' --exclude='src' --exclude='README.md' \
                --exclude='.gitignore' --exclude='package.json' \
                --exclude='package-lock.json' --exclude='tsconfig.json' ./ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
