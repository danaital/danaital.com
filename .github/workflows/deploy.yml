name: Deploy to GitHub Pages

# CI/CD pipeline: every push to master builds and deploys the static site.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions pinned to a commit SHA (not a mutable tag) per GitHub's supply-chain
      # hardening guidance — a tag like `@v4` can be repointed by the action owner
      # (or an attacker who compromises their account) to run different code next
      # build; a SHA can't. The `# vX` comment is just for human readability.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (TypeScript → assets/*.js)
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # This is a no-build static site (HTML/CSS/JS). Upload the repo root,
      # excluding repo-meta files that don't belong on the live site.
      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' \
                --exclude='node_modules' --exclude='src' --exclude='README.md' \
                --exclude='.gitignore' --exclude='package.json' \
                --exclude='package-lock.json' --exclude='tsconfig.json' ./ _site/

      # Minify the STAGED copy only — the repo's assets/*.{js,css} stay
      # human-readable for editing; production bytes get shrunk right before upload.
      - name: Minify production assets
        run: npm run minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
